name: Publish custom extensions

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/publish-custom.yml"
      - ".github/scripts/publish-custom-repo.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-custom
  cancel-in-progress: true

env:
  KEY_STORE_PASSWORD: n66g4ext
  KEY_PASSWORD: n66g4ext
  ALIAS: n66g4

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        id: signing-cache
        with:
          path: |
            signingkey.jks
            signing-fingerprint.txt
          key: signing-key-v1-${{ github.repository }}

      - name: Prepare signing key
        run: |
          if [ ! -f signingkey.jks ]; then
            keytool -genkeypair \
              -keystore signingkey.jks \
              -storepass "$KEY_STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=n66g4 Extensions"
            keytool -list -v -keystore signingkey.jks -storepass "$KEY_STORE_PASSWORD" \
              | grep "SHA256:" | head -1 | awk '{print $2}' | tr -d ':' > signing-fingerprint.txt
            echo "Generated new signing key"
          fi
          echo "SIGNING_KEY_FINGERPRINT=$(cat signing-fingerprint.txt)" >> "$GITHUB_ENV"
          echo "Using fingerprint: $(cat signing-fingerprint.txt)"

      - name: Build custom extensions
        env:
          ALIAS: n66g4
          KEY_STORE_PASSWORD: n66g4ext
          KEY_PASSWORD: n66g4ext
        run: ./gradlew :src:zh:roumanwu:assembleRelease

      - name: Checkout extensions repo
        uses: actions/checkout@v4
        with:
          repository: n66g4/extensions
          ref: repo
          path: extensions-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to custom/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY_FINGERPRINT: ${{ env.SIGNING_KEY_FINGERPRINT }}
        run: |
          pip install -q protobuf
          mkdir -p ~/apk-artifacts/roumanwu
          cp -r src/zh/roumanwu/build/* ~/apk-artifacts/roumanwu/
          cd extensions-repo
          python -u "$GITHUB_WORKSPACE/.github/scripts/publish-custom-repo.py" "${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom/
          if git diff --staged --quiet; then
            echo "No index changes"
          else
            git commit -m "Update custom extensions (${GITHUB_SHA::7})"
            git push
          fi
